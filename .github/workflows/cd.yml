name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DICTIONARY_API_KEY: ${{ secrets.DICTIONARY_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set Date Variable
        run: echo "CURRENT_DATE=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew build
      
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          username: ec2-user
          host: ${{ secrets.EC2_PUBLIC_IP }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: build/libs/word-puzzle.jar
          target: /home/ec2-user/${{ env.CURRENT_DATE }}

      - name: Restart Spring Boot Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          username: ec2-user
          host: ${{ secrets.EC2_PUBLIC_IP }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            kill -9 $(lsof -i:8080 -t)
            nohup java -jar /home/ec2-user/${{ env.CURRENT_DATE }}/build/libs/word-puzzle.jar > /home/ec2-user/${{ env.CURRENT_DATE }}/wordpuzzle.log &
